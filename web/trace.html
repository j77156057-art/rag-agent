<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DocMind · Trace 账本</title>
<style>
  :root{
    --bg:#0e1116; --bg-raised:#161b22; --border:#2a313c; --border-strong:#3a4350;
    --text:#e6edf3; --muted:#8b949e; --dim:#6b7280;
    --green:#3fb950; --amber:#d29922; --red:#f85149; --blue:#58a6ff; --purple:#bc8cff;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;
    padding:12px 18px;background:var(--bg-raised);border-bottom:1px solid var(--border)}
  header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.3px}
  header .sp{flex:1}
  button{background:#1b2430;border:1px solid var(--border-strong);color:#c9d6e4;
    border-radius:6px;padding:5px 11px;cursor:pointer;font:inherit}
  button:hover{border-color:var(--blue);color:#eaf2fb}
  button.warn:hover{border-color:var(--red);color:#ffd7d5}
  label.chk{color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
  input[type=text]{background:var(--bg);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:5px 9px;font:inherit}
  main{padding:16px 18px 40px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
  .card{background:var(--bg-raised);border:1px solid var(--border);border-radius:10px;padding:11px 13px}
  .card .k{color:var(--muted);font-size:11px;letter-spacing:.4px}
  .card .v{font-size:21px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
  .card.acc .v{color:var(--blue)} .card.tok .v{color:var(--purple)}
  .card.warn .v{color:var(--amber)} .card.bad .v{color:var(--red)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--border);vertical-align:top}
  th{color:var(--muted);font-weight:500;position:sticky;top:49px;background:var(--bg);z-index:2}
  tbody tr:hover{background:#12171f}
  td.mono,.mono{font-family:var(--mono);font-size:11px}
  .pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;border:1px solid}
  .pill.ok{color:var(--green);border-color:#1f6f34;background:#10281a}
  .pill.warn{color:var(--amber);border-color:#7a5a12;background:#2a2310}
  .pill.bad{color:var(--red);border-color:#8e2f2b;background:#2c1413}
  .chips{display:flex;flex-wrap:wrap;gap:3px}
  .chip{font-family:var(--mono);font-size:10px;color:#9fb3c8;border:1px solid var(--border);
    border-radius:4px;padding:0 5px;background:#131a24}
  .foot{color:var(--dim);margin-top:14px;font-size:11px}
  .empty{color:var(--muted);padding:26px;text-align:center;border:1px dashed var(--border);border-radius:10px}
  a{color:var(--blue)}
</style>
</head>
<body>
<header>
  <h1>Trace 账本</h1>
  <span class="sp"></span>
  <input type="text" id="token" placeholder="x-docmind-token（如已启用鉴权）" style="width:230px" />
  <label class="chk"><input type="checkbox" id="auto" /> 自动刷新</label>
  <button id="refresh">刷新</button>
  <button id="clear" class="warn">清空</button>
  <a href="/" style="margin-left:6px">← 问答页</a>
</header>
<main>
  <div class="cards" id="cards"></div>
  <div id="tablewrap"></div>
  <p class="foot">只记元数据：不落 prompt / 回答正文，只有长度、哈希、工具名与延迟。</p>
</main>
<script>
const S = {
  turns:{k:'回合数'}, total_tokens:{k:'总 token', cls:'tok'},
  avg_elapsed_ms:{k:'平均耗时', fmt:v=>v+'ms'},
  aborted:{k:'断连中止', cls:'warn'}, errors:{k:'错误', cls:'bad'},
};
let timer = null;

function tok(){ return (document.getElementById('token').value || localStorage.getItem('docmind.token') || '').trim(); }
function hdr(){ const t = tok(); if (!t) return {}; localStorage.setItem('docmind.token', t); return {'x-docmind-token': t}; }

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function outcomePill(o){
  const ok = ['completed','verbatim'].includes(o);
  const bad = ['error','deadline_exceeded','max_steps','truncated','empty'].includes(o);
  const cls = ok ? 'ok' : (bad ? 'bad' : 'warn');
  return `<span class="pill ${cls}">${esc(o||'—')}</span>`;
}

async function load(){
  let data;
  try{
    const r = await fetch('/api/trace?limit=200', {headers: hdr()});
    data = await r.json();
  }catch(e){
    document.getElementById('tablewrap').innerHTML =
      `<div class="empty">无法读取 /api/trace：${esc(e.message)}</div>`;
    return;
  }
  if (!data || data.ok === false){
    document.getElementById('tablewrap').innerHTML =
      `<div class="empty">读取失败：${esc(data && data.error || '未知错误')}${tok()?'':'（若已启用 DOCMIND_API_TOKEN，请在右上填入令牌）'}</div>`;
    return;
  }
  const s = data.summary || {};
  document.getElementById('cards').innerHTML = Object.keys(S).map(key=>{
    const meta = S[key];
    const val = meta.fmt ? meta.fmt(s[key] ?? 0) : (s[key] ?? 0);
    return `<div class="card ${meta.cls||''}"><div class="k">${meta.k}</div><div class="v">${esc(val)}</div></div>`;
  }).join('');

  const rows = (data.items || []).slice().reverse();
  if (!rows.length){
    document.getElementById('tablewrap').innerHTML =
      `<div class="empty">还没有记录。去<a href="/">问答页</a>问一次，这里就会出现逐轮账本。</div>`;
    return;
  }
  const body = rows.map(r=>{
    const steps = (r.steps||[]).map(st=>
      `<span class="chip" title="${esc(st.action)} · ${st.latency_ms}ms · obs ${st.obs_chars}字${st.ok?'':' · 失败'}">${esc(st.action)} ${st.latency_ms}ms</span>`
    ).join('');
    return `<tr>
      <td class="mono">${esc((r.ts||'').replace('T',' '))}</td>
      <td class="mono">${esc(r.session_id)}<div style="color:var(--dim)">${esc(r.turn_id)}</div></td>
      <td class="mono">${esc(r.provider)}<div style="color:var(--dim)">${esc(r.model)}</div></td>
      <td><div class="chips">${steps || '<span style="color:var(--dim)">—</span>'}</div></td>
      <td class="mono">${r.prompt_tokens} / ${r.completion_tokens}<div style="color:var(--dim)">Σ ${r.total_tokens}</div></td>
      <td class="mono">${r.elapsed_ms}ms<div style="color:var(--dim)">llm ${r.llm_ms}ms · ${r.llm_calls}次</div></td>
      <td>${outcomePill(r.outcome)}${r.error?'<div class="mono" style="color:var(--red)">'+esc(r.error).slice(0,90)+'</div>':''}</td>
    </tr>`;
  }).join('');
  document.getElementById('tablewrap').innerHTML = `<table>
    <thead><tr><th>时间</th><th>会话 / 回合</th><th>模型</th><th>工具序列</th><th>tokens in/out</th><th>耗时</th><th>结局</th></tr></thead>
    <tbody>${body}</tbody></table>`;
}

document.getElementById('refresh').onclick = load;
document.getElementById('clear').onclick = async ()=>{
  if (!confirm('清空整个 trace 账本？此操作不可撤销。')) return;
  await fetch('/api/trace/clear', {method:'POST', headers: hdr()});
  load();
};
document.getElementById('auto').onchange = (e)=>{
  if (timer){ clearInterval(timer); timer = null; }
  if (e.target.checked) timer = setInterval(load, 4000);
};
document.getElementById('token').value = localStorage.getItem('docmind.token') || '';
load();
</script>
</body>
</html>
